name: Swift

on:
  push:
    branches: [main]
    paths:
      - "ios-mail/**"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "ios-mail/**"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-mail

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Regenerate project + icon (sanity check)
        run: |
          python3 scripts/generate_appicon.py
          python3 scripts/generate_xcodeproj.py

      - name: Build archive (unsigned, device SDK — no simulator needed)
        run: |
          xcodebuild archive \
            -project QGramMail.xcodeproj \
            -scheme QGramMail \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/QGramMail.xcarchive" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA manually
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/QGramMail.xcarchive/Products/Applications/QGramMail.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r QGramMail-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGramMail-unsigned-ipa
          path: ${{ runner.temp }}/QGramMail-unsigned.ipa
          retention-days: 14
