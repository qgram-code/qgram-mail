name: Swift

on:
  push:
    branches: [main]
    paths:
      - "ios-mail/**"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "ios-mail/**"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-mail

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Regenerate project (sanity check)
        run: python3 scripts/generate_xcodeproj.py

      - name: Build archive (unsigned, device SDK — no simulator needed)
        run: |
          xcodebuild archive \
            -project QGramMail.xcodeproj \
            -scheme QGramMail \
            -archivePath "$RUNNER_TEMP/QGramMail.xcarchive" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA manually
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/QGramMail.xcarchive/Products/Applications/QGramMail.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r QGramMail-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGramMail-unsigned-ipa
          path: ${{ runner.temp }}/QGramMail-unsigned.ipa
          retention-days: 14
